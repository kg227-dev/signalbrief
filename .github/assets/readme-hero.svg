    <text x="275" y="740" fill="#7B7368" font-size="22" font-family="Inter, Arial, sans-serif">Life Sciences</text>
    <circle cx="433" cy="732" r="4.5" fill="#B7AA97"/>
    <text x="453" y="740" fill="#7B7368" font-size="22" font-family="Inter, Arial, sans-serif">Technology</text>
    <circle cx="576" cy="732" r="4.5" fill="#B7AA97"/>
    <text x="596" y="740" fill="#7B7368" font-size="22" font-family="Inter, Arial, sans-serif">Energy</text>
