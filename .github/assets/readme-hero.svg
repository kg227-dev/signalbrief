<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2EEE7"/>
      <stop offset="1" stop-color="#EAE4DB"/>
    </linearGradient>
    <linearGradient id="cta" x1="455" y1="542" x2="745" y2="598" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A69C5"/>
      <stop offset="1" stop-color="#3558B8"/>
    </linearGradient>
    <filter id="glow" x="420" y="520" width="360" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4A69C5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="600" y="154" text-anchor="middle" fill="#1F1B18" font-size="122" font-family="Georgia, 'Times New Roman', serif" font-weight="400">SignalBrief</text>
  <text x="600" y="246" text-anchor="middle" fill="#83786E" font-size="44" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400">
    Walk into your day already knowing what matters
  </text>

  <text x="600" y="336" text-anchor="middle" fill="#514B45" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="400">
    SignalBrief cuts through the noise and brings you the signals shaping
  </text>
  <text x="600" y="388" text-anchor="middle" fill="#514B45" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="400">
    your industry, with clear context on why they matter.
  </text>

  <text x="600" y="480" text-anchor="middle" fill="#514B45" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="400">
    No tabs. No paywalls. No guesswork. Just what you need to stay
  </text>
  <text x="600" y="532" text-anchor="middle" fill="#514B45" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="400">
    sharp.
  </text>

  <g filter="url(#glow)">
    <rect x="455" y="542" width="290" height="84" rx="42" fill="url(#cta)"/>
  </g>
  <text x="600" y="595" text-anchor="middle" fill="white" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="700">Start your brief</text>

  <text x="600" y="698" text-anchor="middle" fill="#706860" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="400">
    Built for operators, consultants, investors, and teams who need to be right
  </text>
</svg>
