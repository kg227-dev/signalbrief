    <text x="998" y="214" fill="#3C352D" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Today’s brief</text>
    <text x="1268" y="214" fill="#857C70" font-size="18" font-family="Inter, Arial, sans-serif">07:00 ET</text>

    <rect x="954" y="270" width="192" height="34" rx="17" fill="#E5EEF9"/>
    <text x="1050" y="292" text-anchor="middle" fill="#2F54B1" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Technology</text>

    <rect x="954" y="322" width="380" height="108" rx="24" fill="#FFFCF8" stroke="#E3D9CB"/>
    <text x="984" y="360" fill="#211D18" font-size="24" font-family="Georgia, 'Times New Roman', serif" font-weight="700">OpenAI expands enterprise rollout</text>
    <text x="984" y="392" fill="#595248" font-size="17" font-family="Inter, Arial, sans-serif">A tighter distribution push signals where AI budgets</text>
    <text x="984" y="416" fill="#595248" font-size="17" font-family="Inter, Arial, sans-serif">are consolidating and who owns workflow demand.</text>

    <rect x="954" y="454" width="192" height="34" rx="17" fill="#E7EFE4"/>
    <text x="1050" y="476" text-anchor="middle" fill="#5E7C42" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Healthcare</text>

    <rect x="954" y="506" width="380" height="96" rx="24" fill="#FFFCF8" stroke="#E3D9CB"/>
    <text x="984" y="544" fill="#211D18" font-size="23" font-family="Georgia, 'Times New Roman', serif" font-weight="700">CMS changes reimbursement timetable</text>
    <text x="984" y="576" fill="#595248" font-size="17" font-family="Inter, Arial, sans-serif">Provider economics shift faster when timing moves</text>
    <text x="984" y="600" fill="#595248" font-size="17" font-family="Inter, Arial, sans-serif">before operating plans have already locked in.</text>

    <g>
      <rect x="954" y="632" width="130" height="34" rx="17" fill="#ECE4D7"/>
      <text x="1019" y="654" text-anchor="middle" fill="#5A5147" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Scan</text>

      <rect x="1096" y="632" width="130" height="34" rx="17" fill="#F0E6D6"/>
      <text x="1161" y="654" text-anchor="middle" fill="#A36512" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Brief</text>

      <rect x="1238" y="632" width="130" height="34" rx="17" fill="#E5EEF9"/>
      <text x="1303" y="654" text-anchor="middle" fill="#2F54B1" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Deep</text>
    </g>

    <text x="954" y="722" fill="#776D61" font-size="18" font-family="Inter, Arial, sans-serif">Trusted trade and official sources. Clear context. No tab sprawl.</text>
