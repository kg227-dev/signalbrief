<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1460" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4EFE7"/>
      <stop offset="1" stop-color="#E7E0D5"/>
    </linearGradient>
    <linearGradient id="panel" x1="960" y1="120" x2="1440" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F7F1E8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4467C8"/>
      <stop offset="1" stop-color="#274896"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#6A5B45" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="920" rx="40" fill="url(#bg)"/>
  <circle cx="1320" cy="178" r="98" fill="#3B5FC0" fill-opacity="0.08"/>
  <circle cx="118" cy="760" r="164" fill="#C2770A" fill-opacity="0.08"/>
  <circle cx="1510" cy="820" r="126" fill="#6D5C47" fill-opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="1456" height="776" rx="30" fill="#FBF7F1" fill-opacity="0.78"/>
  </g>

  <g>
    <rect x="132" y="140" width="170" height="42" rx="21" fill="#E6DDCE"/>
    <text x="217" y="166" text-anchor="middle" fill="#6B645B" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.8">SIGNALBRIEF</text>
  </g>

  <text x="132" y="270" fill="#201C18" font-size="78" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    Daily sector briefings
  </text>
  <text x="132" y="350" fill="#201C18" font-size="78" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    that help you start sharp
  </text>

  <text x="132" y="420" fill="#5B544B" font-size="28" font-family="Inter, Arial, sans-serif">
    SignalBrief gives operators, investors, consultants, and strategy teams
  </text>
  <text x="132" y="460" fill="#5B544B" font-size="28" font-family="Inter, Arial, sans-serif">
    a tighter morning read: trusted sources, clear context, and just enough depth.
  </text>

