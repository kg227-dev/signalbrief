  <text x="247" y="355" text-anchor="middle" fill="#15689B" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1">FINANCIAL SERVICES</text>
  <text x="350" y="358" fill="#47413B" font-size="20" font-family="Inter, Arial, sans-serif">Fed Holds Rates, Signals Two Cuts Possible Before Year End</text>

  <line x1="82" y1="398" x2="1118" y2="398" stroke="#EAE2D8"/>

  <text x="130" y="458" fill="#524A43" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="600">1</text>
  <rect x="150" y="438" width="116" height="24" rx="12" fill="#CFF5DF"/>
  <text x="208" y="455" text-anchor="middle" fill="#0D7A4A" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1">HEALTHCARE</text>
  <rect x="1022" y="434" width="54" height="28" rx="14" fill="#1EB25A"/>
  <text x="1049" y="453" text-anchor="middle" fill="white" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">9.2</text>

  <text x="130" y="520" fill="#1F1B18" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-weight="700">CMS Finalizes Hospital Price Transparency Rules With Enforcement Teeth</text>
  <text x="130" y="570" fill="#2B2622" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Hospitals that continue masking negotiated rates now face daily fines scaled to bed count.</text>
  <text x="915" y="570" fill="#4F4840" font-size="22" font-family="Inter, Arial, sans-serif">The rule closes the</text>
  <text x="130" y="608" fill="#4F4840" font-size="22" font-family="Inter, Arial, sans-serif">audit gap that let most systems delay compliance for three years.</text>
  <text x="130" y="658" fill="#6B635A" font-size="19" font-family="Inter, Arial, sans-serif">Health systems still running opaque chargemasters should accelerate vendor negotiations before enforcement begins. The</text>
  <text x="130" y="692" fill="#6B635A" font-size="19" font-family="Inter, Arial, sans-serif">window to reset contracts quietly is closing.</text>
  <text x="130" y="740" fill="#2E54B4" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700">Read more →</text>

  <line x1="130" y1="790" x2="1070" y2="790" stroke="#EAE2D8"/>

  <text x="130" y="848" fill="#524A43" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="600">2</text>
  <rect x="150" y="828" width="116" height="24" rx="12" fill="#DCE8FE"/>
  <text x="208" y="845" text-anchor="middle" fill="#2E54B4" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1">TECHNOLOGY</text>
  <rect x="1022" y="824" width="54" height="28" rx="14" fill="#27C268"/>
  <text x="1049" y="843" text-anchor="middle" fill="white" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">8.7</text>

  <text x="130" y="910" fill="#1F1B18" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Microsoft Embeds Copilot Directly Into Azure Data Factory Pipelines</text>
  <text x="130" y="960" fill="#2B2622" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700">Enterprise data teams can now generate and debug ETL pipelines in plain language.</text>
  <text x="1030" y="960" fill="#4F4840" font-size="22" font-family="Inter, Arial, sans-serif">The</text>
  <text x="130" y="998" fill="#4F4840" font-size="22" font-family="Inter, Arial, sans-serif">integration targets the 60% of pipeline failures that originate in configuration errors.</text>
  <text x="130" y="1048" fill="#6B635A" font-size="19" font-family="Inter, Arial, sans-serif">IT organizations still evaluating AI tooling for data engineering now have a production-grade answer from their existing</text>
  <text x="130" y="1082" fill="#6B635A" font-size="19" font-family="Inter, Arial, sans-serif">vendor. The build-vs-buy calculus just shifted.</text>
  <text x="130" y="1128" fill="#2E54B4" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700">Read more →</text>
