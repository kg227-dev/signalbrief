  <text x="292" y="278" fill="#47413B" font-size="20" font-family="Inter, Arial, sans-serif">CMS Finalizes Hospital Price Transparency Rules With Enforcement Teeth</text>

  <text x="130" y="318" fill="#524A43" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="600">2</text>
