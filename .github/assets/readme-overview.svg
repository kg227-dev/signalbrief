  <text x="213" y="315" text-anchor="middle" fill="#2E54B4" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1">TECHNOLOGY</text>
  <text x="282" y="318" fill="#47413B" font-size="20" font-family="Inter, Arial, sans-serif">Microsoft Embeds Copilot Directly Into Azure Data Factory Pipelines</text>

