name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Module linkage check
        run: npm run check:module-linkage

      - name: Critical path tests
        run: npm test

      - name: Worker smoke test
        run: npm run smoke:worker

      - name: Admin scheduler smoke test
        run: npm run smoke:admin-scheduler
