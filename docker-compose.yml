  worker:
    <<: *app-image
    command: ["node", "src/entrypoints/scheduler-worker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SIGNALBRIEF_STORE_BACKEND=${SIGNALBRIEF_STORE_BACKEND:-file}
      - SIGNALBRIEF_SQLITE_PATH=${SIGNALBRIEF_SQLITE_PATH:-/app/data/signalbrief.sqlite}
      - SIGNALBRIEF_STORE_CANARY_CHAT_IDS=${SIGNALBRIEF_STORE_CANARY_CHAT_IDS:-}
      - SIGNALBRIEF_STORE_CANARY_MIRROR_WRITES=${SIGNALBRIEF_STORE_CANARY_MIRROR_WRITES:-1}
      - DIGEST_POLL_MS=300000
      - DIGEST_STARTUP_DELAY_MS=5000
      - DIGEST_RUN_ON_STARTUP=0
      - DIGEST_RUN_TIMEOUT_MS=1500000
      - SCHEDULER_HEARTBEAT_FILE=/app/data/scheduler-heartbeat.json
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./archive:/app/archive
    init: true
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const fs=require('fs');const p='/app/data/scheduler-heartbeat.json';if(!fs.existsSync(p))process.exit(1);const h=JSON.parse(fs.readFileSync(p,'utf8'));const ts=Date.parse(h.updated_at||'');const poll=Number(h.poll_ms||300000);const maxAge=Math.max(poll*2,600000);process.exit(Number.isFinite(ts)&&Date.now()-ts<=maxAge?0:1);"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
