x-app-image: &app-image
  image: ${SIGNALBRIEF_APP_IMAGE:-app-signalbrief:latest}
  build:
    context: .

services:
  web:
    <<: *app-image
    command: ["node", "web/server.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SIGNALBRIEF_STORE_BACKEND=${SIGNALBRIEF_STORE_BACKEND:-file}
      - SIGNALBRIEF_SQLITE_PATH=${SIGNALBRIEF_SQLITE_PATH:-/app/data/signalbrief.sqlite}
      - SIGNALBRIEF_STORE_CANARY_CHAT_IDS=${SIGNALBRIEF_STORE_CANARY_CHAT_IDS:-}
      - SIGNALBRIEF_STORE_CANARY_MIRROR_WRITES=${SIGNALBRIEF_STORE_CANARY_MIRROR_WRITES:-1}
      - PORT=3003
      - SCHEDULER_HEARTBEAT_FILE=/app/data/scheduler-heartbeat.json
    ports:
      - "3003:3003"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./archive:/app/archive
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3003/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

