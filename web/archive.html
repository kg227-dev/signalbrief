<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignalBrief — Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FAFAF8; --card:#FFFFFF; --text:#1A1A1A; --text-secondary:#6B7280;
  --accent:#2563EB; --accent-light:#EFF6FF; --border:#E5E7EB;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04); --shadow-md:0 4px 12px rgba(0,0,0,0.06);
  --radius:12px; --radius-sm:8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
.container { max-width:720px; margin:0 auto; padding:40px 24px 80px; }

/* Header */
.header { margin-bottom:40px; animation:fadeUp 0.5s ease both; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.brand-link { font-family:'Instrument Serif',serif; font-size:24px; color:var(--text); text-decoration:none; display:flex; align-items:center; gap:8px; }
.subscribe-link { font-size:14px; font-weight:600; color:var(--accent); text-decoration:none; padding:8px 16px; border:1.5px solid var(--accent); border-radius:100px; transition:all 0.2s; }
.subscribe-link:hover { background:var(--accent-light); }
.archive-title { font-family:'Instrument Serif',serif; font-size:36px; font-weight:400; letter-spacing:-0.4px; margin-bottom:6px; }
.archive-sub { color:var(--text-secondary); font-size:15px; }

/* List view */
.digest-list { display:flex; flex-direction:column; gap:12px; }
.digest-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 24px; cursor:pointer; transition:all 0.2s ease;
  box-shadow:var(--shadow-sm); animation:fadeUp 0.4s ease both;
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
}
.digest-card:hover { border-color:var(--accent); box-shadow:var(--shadow-md); transform:translateY(-1px); }
.digest-card-left {}
.digest-date { font-size:13px; font-weight:600; color:var(--accent); margin-bottom:4px; letter-spacing:0.2px; }
.digest-scan { font-size:14px; color:var(--text-secondary); line-height:1.5; }
.digest-card-right { flex-shrink:0; }
.digest-count { font-size:12px; color:var(--text-secondary); background:var(--bg); padding:4px 10px; border-radius:100px; border:1px solid var(--border); white-space:nowrap; }

/* Detail view */
.detail-view { display:none; }
.back-btn { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--accent); cursor:pointer; margin-bottom:24px; background:none; border:none; padding:0; font-family:inherit; }
.back-btn:hover { opacity:0.7; }
.detail-header { margin-bottom:32px; }
.detail-date { font-size:13px; font-weight:600; color:var(--accent); margin-bottom:4px; }
.detail-title { font-family:'Instrument Serif',serif; font-size:28px; font-weight:400; letter-spacing:-0.3px; margin-bottom:10px; }
.detail-scan-box { background:#F3F4F6; border-radius:8px; padding:14px 18px; font-size:13px; color:var(--text-secondary); line-height:1.7; }

.item-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.item-lead { border-left:3px solid var(--accent); padding-left:16px; }
.item-meta { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.item-lead-badge { font-size:11px; font-weight:700; letter-spacing:0.05em; color:var(--accent); }
.item-tag { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent); background:var(--accent-light); padding:2px 8px; border-radius:4px; }
.item-headline { font-size:17px; font-weight:600; line-height:1.3; margin-bottom:8px; letter-spacing:-0.2px; }
.item-summary { font-size:14px; color:var(--text-secondary); line-height:1.6; margin-bottom:12px; }
.item-wim-label { font-size:11px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.item-wim { font-size:14px; color:#374151; line-height:1.65; margin-bottom:10px; }
.item-link a { font-size:13px; color:var(--accent); text-decoration:none; font-weight:500; }
.item-link a:hover { text-decoration:underline; }

.empty-state { text-align:center; padding:60px 24px; color:var(--text-secondary); }
.empty-icon { font-size:36px; margin-bottom:12px; }
.empty-title { font-size:18px; font-weight:600; color:var(--text); margin-bottom:8px; }

.footer { text-align:center; margin-top:48px; font-size:13px; color:var(--text-secondary); }
.footer a { color:var(--accent); text-decoration:none; }

@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@media (max-width:600px) {
  .container { padding:24px 16px 60px; }
  .archive-title { font-size:28px; }
  .digest-card { flex-direction:column; gap:8px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-top">
      <a href="/" class="brand-link">☀️ SignalBrief</a>
      <a href="/" class="subscribe-link">Subscribe →</a>
    </div>
    <h1 class="archive-title">Past Digests</h1>
    <p class="archive-sub">Every issue, searchable and readable in full.</p>
  </div>

  <!-- List view -->
  <div id="listView">
    <div class="digest-list" id="digestList">
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-title">No digests yet</div>
        <p>Your first digest will appear here after it's delivered.</p>
      </div>
    </div>
  </div>

  <!-- Detail view -->
  <div id="detailView" class="detail-view">
    <button class="back-btn" onclick="showList()">← Back to archive</button>
    <div class="detail-header">
      <div class="detail-date" id="detailDate"></div>
      <div class="detail-title">SignalBrief</div>
      <div class="detail-scan-box" id="detailScan"></div>
    </div>
    <div id="detailItems"></div>
  </div>

  <div class="footer">Powered by SignalBrief · Built with OpenClaw</div>
</div>

<script>
let allDigests = [];

async function loadList() {
  const res = await fetch('/api/archive');
  const data = await res.json();
  allDigests = data.digests || [];
  renderList();
}

function renderList() {
  const el = document.getElementById('digestList');
  if (!allDigests.length) return; // keep empty state
  el.innerHTML = allDigests.map((d, i) => `
    <div class="digest-card" onclick="loadDetail('${d.date}')" style="animation-delay:${i * 0.05}s">
      <div class="digest-card-left">
        <div class="digest-date">${d.dateStr || d.date}</div>
        <div class="digest-scan">${d.quickScan || ''}</div>
      </div>
      <div class="digest-card-right">
        <div class="digest-count">${d.itemCount || 7} signals</div>
      </div>
    </div>
  `).join('');
}

async function loadDetail(date) {
  const res = await fetch('/api/archive/' + date);
  const d = await res.json();
  if (d.error) return;

  document.getElementById('detailDate').textContent = d.dateStr || d.date;
  document.getElementById('detailScan').innerHTML = (d.quickScan || '').replace(/ &nbsp;·&nbsp; /g, ' &nbsp;·&nbsp; ');

  document.getElementById('detailItems').innerHTML = d.items.map((item, i) => {
    const isLead = i === 0;
    const linkUrl = item.url && item.url !== '#' ? item.url : 'https://' + item.source;
    return `
      <div class="item-card${isLead ? ' item-lead' : ''}">
        <div class="item-meta">
          ${isLead ? '<span class="item-lead-badge">★ LEAD</span>' : `<span style="font-size:13px;color:#9CA3AF;font-weight:600;">${i+1}</span>`}
          <span class="item-tag">${item.tag}</span>
        </div>
        <div class="item-headline">${item.headline}</div>
        <div class="item-summary">${item.summary}</div>
        ${item.wim ? `
          <div class="item-wim-label">Why it matters</div>
          <div class="item-wim">${item.wim}</div>
        ` : ''}
        <div class="item-link"><a href="${linkUrl}" target="_blank" rel="noopener">Read more → ${item.source}</a></div>
      </div>
    `;
  }).join('');

  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showList() {
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadList();
</script>
</body>
</html>
